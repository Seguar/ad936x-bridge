# FMCOMMS5 RF bridge settings, applied at boot by fmcomms5-bridge.service
# Best EVM for MXG -4 dBm (about -11 dBm per RX input after the 1:4 splitter):
#   RX 8 dB / TX -20 dB -> 2.1 % (-33.5 dB), sweep 2026-11-12
LO_HZ=2000000000        # RX and TX LO of both AD9361 [Hz]
RX_GAIN_DB=8            # manual RX gain, all 4 RX channels [dB]
TX_ATT_DB=-20           # TX attenuation, all 4 TX channels [dB, 0 ... -89.75]
LOOPBACK=2              # 2 = FPGA RX -> TX (bridge), 0 = off
